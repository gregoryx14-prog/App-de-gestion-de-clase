{e=>setPlanForm({...planForm,periodo:e.target.value})}><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option><option value="4">P4</option></select><select required value={planForm.curso_id} onChange={e=>setPlanForm({...planForm,curso_id:e.target.value,asignatura_id:'',competencia_id:''})}><option value="">Clase</option>{cursos.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select>{planForm.curso_id&&<select required value={planForm.asignatura_id} onChange={e=>{setPlanForm({...planForm,asignatura_id:e.target.value,competencia_id:''});req('/competencias?asignatura_id='+e.target.value).then(setComps).catch(fail)}}><option value="">Asignatura</option>{asigsForCourse(cursos,asigs,planForm.curso_id).map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}</select>}<select value={planForm.competencia_id} onChange={e=>setPlanForm({...planForm,competencia_id:e.target.value})}><option value="">Sin competencia específica</option>{comps.map(c=><option key={c.id} value={c.id}>{c.codigo} · {c.nombre}</option>)}</select><input required placeholder="Título / unidad / actividad" value={planForm.titulo} onChange={e=>setPlanForm({...planForm,titulo:e.target.value})}/><label>Inicio<input type="date" value={planForm.fecha_inicio} onChange={e=>setPlanForm({...planForm,fecha_inicio:e.target.value})}/></label><label>Fin<input type="date" value={planForm.fecha_fin} onChange={e=>setPlanForm({...planForm,fecha_fin:e.target.value})}/></label><input placeholder="Tipo de actividad" value={planForm.tipo_actividad} onChange={e=>setPlanForm({...planForm,tipo_actividad:e.target.value})}/><select value={planForm.instrumento} onChange={e=>setPlanForm({...planForm,instrumento:e.target.value})}>{instruments.map(i=><option key={i}>{i}</option>)}</select><input placeholder="Recursos" value={planForm.recursos} onChange={e=>setPlanForm({...planForm,recursos:e.target.value})}/><select value={planForm.estado} onChange={e=>setPlanForm({...planForm,estado:e.ta  {tab==='horario'&&<div className="grid"><section className="card wide"><div className="dashHeader"><div><h2>Horario escolar</h2><p>Programación semanal de clases por día, hora, asignatura, docente y aula. El sistema bloquea solapamientos de una clase o docente.</p></div><select value={horarioCurso} onChange={e=>setHorarioCurso(e.target.value)}><option value="">Todas las clases</option>{cursos.map(c=><option key={c.id} value={c.id}>{c.nombre} · {c.grado||''} {c.seccion||''}</option>)}</select></div><table><thead><tr><th>Día</th><th>Hora</th><th>Clase</th><th>Asignatura</th><th>Docente</th><th>Aula</th><th>Bloque</th><th></th></tr></thead><tbody>{horario.map(x=><tr key={x.id}><td>{['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][x.dia_semana]}</td><td>{x.hora_inicio}–{x.hora_fin}</td><td>{x.curso_nombre}</td><td>{x.asignatura_nombre}</td><td>{x.docente_nombre||'Sin asignar'}</td><td>{x.aula||'—'}</td><td>{x.bloque||'—'}</td><td><button onClick={()=>deleteHorario(x.id)}>Eliminar</button></td></tr>)}</tbody></table></section><section className="card"><h2>Nuevo bloque</h2><form onSubmit={addHorario} className="formGrid"><select value={horarioForm.dia_semana} onChange={e=>setHorarioForm({...horarioForm,dia_semana:e.target.value})}>{[['1','Lunes'],['2','Martes'],['3','Miércoles'],['4','Jueves'],['5','Viernes'],['6','Sábado'],['7','Domingo']].map(([v,n])=><option value={v} key={v}>{n}</option>)}</select><input type="time" required value={horarioForm.hora_inicio} onChange={e=>setHorarioForm({...horarioForm,hora_inicio:e.target.value})}/><input type="time" required value={horarioForm.hora_fin} onChange={e=>setHorarioForm({...horarioForm,hora_fin:e.target.value})}/><select required value={horarioForm.curso_id} onChange={e=>setHorarioForm({...horarioForm,curso_id:e.target.value,asignatura_id:'',docente_id:''})}><option value="">Clase</option>{cursos.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select>{horarioForm.curso_id&&<select required value={horarioForm.asignatura_id} onChange={e=>{const a=asigsForCourse(cursos,asigs,horarioForm.curso_id).find(z=>z.id===Number(e.target.value));setHorarioForm({...horarioForm,asignatura_id:e.target.value,docente_id:a?.docente_id||''})}}><option value="">Asignatura</option>{asigsForCourse(cursos,asigs,horarioForm.curso_id).map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}</select>}<select value={horarioForm.docente_id} onChange={e=>setHorarioForm({...horarioForm,docente_id:e.target.value})}><option value="">Docente automático</option>{docs.filter(d=>d.estado==='Activo').map(d=><option key={d.id} value={d.id}>{d.nombre}</option>)}</select><input placeholder="Aula" value={horarioForm.aula} onChange={e=>setHorarioForm({...horarioForm,aula:e.target.value})}/><input placeholder="Bloque / período" value={horarioForm.bloque} onChange={e=>setHorarioForm({...horarioForm,bloque:e.target.value})}/><button>Guardar bloque</button></form></section></div>}
 {tab==='agenda'&&<div className="grid"><section className="card wide"><div className="dashHeader"><div><h2>Agenda y calendario académico</h2><p>Vista mensual de eventos y actividades evaluativas. Los eventos pueden vincularse a una clase, asignatura o estudiante.</p></div><div className="toolbar"><button onClick={()=>setAgendaMonth(new Date(agendaMonth.getFullYear(),agendaMonth.getMonth()-1,1))}>‹</button><b>{agendaMonth.toLocaleDateString('es-DO',{month:'long',year:'numeric'})}</b><button onClick={()=>setAgendaMonth(new Date(agendaMonth.getFullYear(),agendaMonth.getMonth()+1,1))}>›</button><select value={agendaCurso} onChange={e=>setAgendaCurso(e.target.value)}><option value="">Todas las clases</option>{cursos.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select><select value={agendaTipo} onChange={e=>setAgendaTipo(e.target.value)}><option value="">Todos los tipos</option><option>Reunión</option><option>Evaluación</option><option>Actividad</option><option>Consejo</option><option>Administrativo</option><option>Permiso</option><option>Otro</option></select></div></div><div className="calendarGrid">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=><div className="calHead" key={d}>{d}</div>)}{Array.from({length:(new Date(agendaMonth.getFullYear(),agendaMonth.getMonth(),1).getDay()+6)%7}).map((_,i)=><div className="calCell empty" key={'e'+i}/>) }{Array.from({length:new Date(agendaMonth.getFullYear(),agendaMonth.getMonth()+1,0).getDate()}).map((_,i)=>{const day=i+1;const ds=new Date(agendaMonth.getFullYear(),agendaMonth.getMonth(),day).toISOString().slice(0,10);const ev=agendaEvents.filter(x=>x.fecha===ds);return <div className="calCell" key={ds}><div className="calDay">{day}</div>{ev.slice(0,5).map(x=><div className="calEvent" key={String(x.id)} title={x.descripcion||x.titulo}><b>{x.hora_inicio||'•'}</b> {x.titulo}<small>{x.asignatura_nombre||x.curso_nombre||x.estudiante_nombre||''}</small>{!x.solo_lectura&&<button className="eventDelete" onClick={()=>deleteAgendaEvent(x.id)}>×</button>}</div>)}{ev.length>5&&<small>+{ev.length-5} más</small>}</div>})}</div></section><section className="card"><h2>Nuevo evento</h2><form onSubmit={addAgendaEvent} className="formGrid"><input required placeholder="Título" value={agendaForm.titulo} onChange={e=>setAgendaForm({...agendaForm,titulo:e.target.value})}/><select value={agendaForm.tipo} onChange={e=>setAgendaForm({...agendaForm,tipo:e.target.value})}><option>Reunión</option><option>Evaluación</option><option>Actividad</option><option>Consejo</option><option>Administrativo</option><option>Permiso</option><option>Otro</option></select><input type="date" value={agendaForm.fecha} onChange={e=>setAgendaForm({...agendaForm,fecha:e.target.value})}/><label><input type="checkbox" checked={agendaForm.todo_el_dia} onChange={e=>setAgendaForm({...agendaForm,todo_el_dia:e.target.checked})}/> Todo el día</label>{!agendaForm.todo_el_dia&&<><input type="time" value={agendaForm.hora_inicio} onChange={e=>setAgendaForm({...agendaForm,hora_inicio:e.target.value})}/><input type="time" value={agendaForm.hora_fin} onChange={e=>setAgendaForm({...agendaForm,hora_fin:e.target.value})}/></>}<select value={agendaForm.curso_id} onChange={e=>setAgendaForm({...agendaForm,curso_id:e.target.value,asignatura_id:''})}><option value="">Sin clase específica</option>{cursos.map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</select>{agendaForm.curso_id&&<select value={agendaForm.asignatura_id} onChange={e=>setAgendaForm({...agendaForm,asignatura_id:e.target.value})}><option value="">Sin asignatura</option>{asigsForCourse(cursos,asigs,agendaForm.curso_id).map(a=><option key={a.id} value={a.id}>{a.nombre}</option>)}</select>}<select value={agendaForm.estudiante_id} onChange={e=>setAgendaForm({...agendaForm,estudiante_id:e.target.value})}><option value="">Sin estudiante específico</option>{visibleStudents.map(x=><option key={x.id} value={x.id}>{x.nombre} · {x.matricula}</option>)}</select><input placeholder="Ubicación" value={agendaForm.ubicacion} onChange={e=>setAgendaForm({...agendaForm,ubicacion:e.target.value})}/><input type="number" min="0" placeholder="Recordatorio (minutos)" value={agendaForm.recordatorio_minutos} onChange={e=>setAgendaForm({...agendaForm,recordatorio_minutos:e.target.value})}/><textarea placeholder="Descripción" value={agendaForm.descripcion} onChange={e=>setAgendaForm({...agendaForm,descripcion:e.target.value})}/><button>Guardar evento</button></form></section><section className="card wide"><h2>Próximos eventos</h2>{agendaEvents.filter(x=>x.fecha>=today).slice(0,15).map(x=><div className="agendaList" key={String(x.id)}><b>{x.fecha}</b> · {x.hora_inicio||'Todo el día'} · <b>{x.titulo}</b> <span>{x.tipo}</span><small>{x.curso_nombre||''}{x.asignatura_nombre?' · '+x.asignatura_nombre:''}{x.estudiante_nombre?' · '+x.estudiante_nombre:''}</small></div>)}</section></div>}
 {tab==='periodos'&&<div className="grid"><section className="card"><h2>Años escolares</h2><p>Administra el año escolar activo, sus fechas y su estado de cierre. Solo puede existir un año activo a la vez.</p><form onSubmit={crearAnio} className="formGrid"><input required placeholder="Nombre del año escolar, ej. 2027-2028" value={anioForm.nombre} onChange={e=>setAnioForm({...anioForm,nombre:e.target.value})}/><label>Inicio<input type="date" value={anioForm.fecha_inicio} onChange={e=>setAnioForm({...anioForm,fecha_inicio:e.target.value})}/></label><label>Fin<input type="date" value={anioForm.fecha_fin} onChange={e=>setAnioForm({...anioForm,fecha_fin:e.target.value})}/></label><label><input type="checkbox" checked={anioForm.cerrado} onChange={e=>setAnioForm({...anioForm,cerrado:e.target.checked})}/> Cerrado</label><button>Crear año escolar</button></form><table><thead><tr><th>Año</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th></tr></thead><tbody>{anios.map(a=><tr key={a.id}><td><b>{a.nombre}</b></td><td>{a.fecha_inicio||'—'}</td><td>{a.fecha_fin||'—'}</td><td>{a.cerrado?'Cerrado':a.activo?'Activo':'Inactivo'}</td><td>{!a.cerrado&&!a.activo&&<button onClick={()=>activarAnio(a.id)}>Activar</button>}</td></tr>)}</tbody></table></section><section className="card"><h2>Períodos académicos</h2><div className="toolbar"><select value={anioSel} onChange={e=>setAnioSel(e.target.value)}>{anios.map(a=><option key={a.id} value={a.id}>{a.nombre}{a.activo?' · Activo':''}</option>)}</select></div>{periodos.length?periodos.map(p=>{const f=periodoDraft[p.id]||p;return <div className="configRow" key={p.id}><label>P{p.numero}<input value={f.nombre||''} onChange={e=>setPeriodoDraft({...periodoDraft,[p.id]:{...f,nombre:e.target.value}})}/></label><input type="date" value={f.fecha_inicio||''} onChange={e=>setPeriodoDraft({...periodoDraft,[p.id]:{...f,fecha_inicio:e.target.value}})}/><input type="date" value={f.fecha_fin||''} onChange={e=>setPeriodoDraft({...periodoDraft,[p.id]:{...f,fecha_fin:e.target.value}})}/><select value={f.estado||'Programado'} onChange={e=>setPeriodoDraft({...periodoDraft,[p.id]:{...f,estado:e.target.value}})}><option>Programado</option><option>Activo</option><option>Cerrado</option></select><button onClick={()=>savePeriodo(p.id)}>Guardar</button></div>}) : <p>No hay períodos configurados.</p>}</section></div>}
 {tab==='seguridad'&&<div className="grid"><section className="card"><h2>Seguridad y auditoría</h2><p>El sistema registra accesos autenticados y operaciones de API para facilitar la trazabilidad administrativa. Las contraseñas se almacenan mediante PBKDF2-SHA256 y el cambio de contraseña requiere al menos 8 caracteres.</p><div className="toolbar"><select value={auditLimit} onChange={e=>setAuditLimit(e.target.value)}><option value="50">50 registros</option><option value="100">100 registros</option><option value="250">250 registros</option><option value="500">500 registros</option></select><button onClick={loadAudit}>Actualizar</button><button onClick={clearAudit}>Limpiar historial</button></div><div className="tableScroll"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Método</th><th>Ruta</th><th>HTTP</th><th>IP</th></tr></thead><tbody>{audit.map(a=><tr key={a.id}><td>{a.fecha}</td><td>{a.usuario||'—'}</td><td>{a.metodo}</td><td>{a.ruta}</td><td>{a.estado_http}</td><td>{a.ip||'—'}</td></tr>)}</tbody></table></div></section><section className="card"><h2>Datos institucionales</h2><p>Estos datos pueden utilizarse posteriormente en reportes y documentos del centro.</p><form onSubmit={saveInstitucion} className="formGrid"><input required placeholder="Nombre del centro" value={institucion.nombre_centro} onChange={e=>setInstitucion({...institucion,nombre_centro:e.target.value})}/><input placeholder="Código del centro" value={institucion.codigo_centro} onChange={e=>setInstitucion({...institucion,codigo_centro:e.target.value})}/><input placeholder="Distrito educativo" value={institucion.distrito} onChange={e=>setInstitucion({...institucion,distrito:e.target.value})}/><input placeholder="Regional" value={institucion.regional} onChange={e=>setInstitucion({...institucion,regional:e.target.value})}/><input placeholder="Dirección" value={institucion.direccion} onChange={e=>setInstitucion({...institucion,direccion:e.target.value})}/><input placeholder="Teléfono" value={institucion.telefono} onChange={e=>setInstitucion({...institucion,telefono:e.target.value})}/><input type="email" placeholder="Correo institucional" value={institucion.correo} onChange={e=>setInstitucion({...institucion,correo:e.target.value})}/><input placeholder="Director/a" value={institucion.director} onChange={e=>setInstitucion({...institucion,director:e.target.value})}/><button>Guardar datos institucionales</button></form></section></div>}
 {tab==='sistema'&&<div className="grid"><section className="card"><h2>Estado del sistema</h2><p>Panel técnico de consolidación. La integridad de SQLite se comprueba mediante el backend.</p><button onClick={loadSystemStatus}>Actualizar estado</button>{systemStatus&&<><h3>Versión</h3><p><b>{systemStatus.version}</b></p><h3>Base de datos</h3><p>Integridad: <b>{systemStatus.base_datos?.integridad}</b></p><p>Ruta: <code>{systemStatus.base_datos?.ruta}</code></p><div className="tableScroll"><table><thead><tr><th>Tabla</th><th>Registros</th></tr></thead><tbody>{Object.entries(systemStatus.conteos||{}).map(([k,v])=><tr key={k}><td>{k}</td><td>{v??'—'}</td></tr>)}</tbody></table></div></>}</section><section className="card"><h2>Preparación para producción</h2><ul><li>Configura <code>GESTION_SECRET_KEY</code> con una clave aleatoria y privada.</li><li>Revisa el origen permitido del frontend si cambia el dominio.</li><li>Realiza respaldos SQLite periódicos.</li><li>Prueba restauraciones en una copia antes de usarlas sobre datos reales.</li></ul><p>El proyecto incluye Docker y un compose de producción con frontend servido mediante Nginx.</p></section></div>}
 {tab==='config'&&<section className="card"><h2>Configuración académica</h2><p>Solo el administrador puede modificar las fórmulas y parámetros.</p>{config.map(x=><div className="configRow" key={x.clave}><label>{x.clave}<input value={configDraft[x.clave]??''} onChange={e=>setConfigDraft({...configDraft,[x.clave]:e.target.value})}/></label><button onClick={()=>saveConfig(x.clave)}>Guardar</button></div>)}</section>}
 {tab==='admin'&&<div className="grid"><section className="card"><h2>Docentes</h2><table><thead><tr><th>Nombre</th><th>Especialidad</th><th>Estado</th></tr></thead><tbody>{docs.map(d=><tr key={d.id}><td>{d.nombre}</td><td>{d.especialidad||'—'}</td><td>{d.estado}</td></tr>)}</tbody></table></section><section className="card"><h2>Usuarios</h2><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Activo</th></tr></thead><tbody>{users.map(u=><tr key={u.id}><td>{u.usuario}</td><td>{u.nombre}</td><td>{u.rol}</td><td>{u.activo?'Sí':'No'}</td></tr>)}</tbody></table></section></div><section className="card"><h2>Administración avanzada</h2><p>Importación, exportación y respaldos. Realiza una copia antes de restaurar.</p><div className="toolbar"><button onClick={()=>downloadAdmin('/admin/exportar/general.xlsx','gestion_clase_respaldo_general.xlsx')}>Exportar datos generales XLSX</button><button onClick={()=>downloadAdmin('/admin/backup','gestion_clase_v5_1_backup.db')}>Descargar respaldo SQLite</button><label className="buttonLike">Restaurar respaldo<input type="file" accept=".db,.sqlite,.sqlite3" onChange={restoreAdmin} hidden/></label></div></section><section className="card"><h2>Importación CSV</h2><p>Docentes: nombre, cedula, correo, telefono, especialidad, estado. Estudiantes: nombres, apellidos, fecha_nacimiento, curso_id (o curso), correo, telefono, estado, matricula opcional.</p><form onSubmit={importAdmin} className="formGrid"><select value={adminImportType} onChange={e=>setAdminImportType(e.target.value)}><option value="estudiantes">Estudiantes</option><option value="docentes">Docentes</option></select><input type="file" accept=".csv,text/csv" onChange={e=>setAdminImportFile(e.target.files?.[0]||null)} required/><button>Importar CSV</button></form>{adminImportMsg&&<p>{adminImportMsg}</p>}</section></div>}
 </main></div>
