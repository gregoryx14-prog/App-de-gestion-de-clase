
services:
  - type: web
    name: gestion-clase-v51
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-clase-db
          property: connectionString

      - key: GESTION_SECRET_KEY
        sync: false

      - key: GESTION_TOKEN_MINUTES
        value: "480"

databases:
  - name: gestion-clase-db
    plan: free
    postgresMajorVersion: "16"